name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: The client reaches the eval-history read path (static archive)
        run: |
          python - <<'PY'
          from promptregress.client import client_for
          from promptregress.gate import _pick_baseline
          runs = client_for("https://erikhill.dev/eval-history/").list_runs("rag-eval-lab", limit=10)
          assert isinstance(runs, list)
          # a baseline is pickable (or None), and only ci runs qualify
          b = _pick_baseline(runs, "x")
          assert b is None or b.get("source") == "ci"
          print(f"OK: {len(runs)} runs, baseline={'none' if not b else b['git_sha']}")
          PY
