name: prompt-regress
description: >-
  Gate a pull request's eval run against the main-branch baseline in eval-history,
  post the verdict as a PR comment, and fail the check if it regressed.
branding:
  icon: git-pull-request
  color: purple

inputs:
  run:
    description: Path to the eval_run.json your eval produced.
    required: true
  suite:
    description: Suite name (usually the run's `run` field / your project name).
    required: true
  api:
    description: eval-history base URL.
    required: false
    default: https://eval-history.onrender.com
  write-key:
    description: >-
      eval-history write key. Pass a secret; empty (e.g. fork PRs) makes the gate
      skip cleanly instead of failing.
    required: false
    default: ""
  fail-on-regression:
    description: Exit non-zero (fail the check) when a regression is detected.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install prompt-regress
      shell: bash
      run: pip install "git+https://github.com/egnaro9/prompt-regress@${{ github.action_ref || 'main' }}"

    - name: Gate the run
      id: gate
      shell: bash
      env:
        EVAL_HISTORY_WRITE_KEY: ${{ inputs.write-key }}
      run: |
        set +e
        prompt-regress gate \
          --run "${{ inputs.run }}" --suite "${{ inputs.suite }}" --api "${{ inputs.api }}" \
          --git-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
          --label "$(git log -1 --pretty=%s)" \
          --comment-file "$RUNNER_TEMP/prompt-regress.md" \
          ${{ inputs.fail-on-regression == 'true' && ' ' || '--no-fail' }}
        echo "code=$?" >> "$GITHUB_OUTPUT"

    - name: Comment on the PR
      if: github.event_name == 'pull_request' && hashFiles(format('{0}/prompt-regress.md', runner.temp)) != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh pr comment "${{ github.event.pull_request.number }}" \
          --body-file "$RUNNER_TEMP/prompt-regress.md" || true

    - name: Fail the check on regression
      if: steps.gate.outputs.code != '0'
      shell: bash
      run: |
        echo "prompt-regress: regression detected — blocking merge."
        exit 1
